# layers run three times), compressed by LookAtMyQuant into 63 files, 12,760,459,456 bytes (inkling2-packed-v1).
# The engine reads the pack in place: nothing is converted or repacked. Before each serve, the prepare step writes a
# small GGUF that names the pack's arrays, and llama-server is given that GGUF.
# [run] is the configuration the goal campaign's judge measured it with, on this engine.
# Draft until the 0.4.0-rc1 image is built, pinned below and measured on a P100 (docs/receipts/engine-v0.4.0/).
