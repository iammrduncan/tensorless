# Qwen3.8-27B-PN3 on one Tesla P100 16 GB.
# [run] is the configuration the hill climbs' judge measured: its llama-server flags and its engine
# switches, the same for the decode climb (engine-v0.1.0) and the prefill climb (engine-v0.2.0).
# The prefill climb's faster prompt path is on by default in engine-v0.2.0 and needs no switch.
# The model file is the one the climbs measured (sha256 15ce2d44...).
# Released in engine-v0.4.1 after the published image was measured on a P100 (docs/receipts/engine-v0.4.1/).
# [run] did not change from engine-v0.4.0; the engine-v0.4.0 recipe is this file at the tag v0.4.0 (image sha256:4a015323...).
# engine-v0.4.0 added GGML_CUDA_SYNC_SCHED = "auto", which keeps engine-v0.3.0's host sync schedule; the engine-v0.3.0
# recipe is this file at the tag v0.3.0 (image sha256:3423499a...).
# The engine-v0.2.0 recipe is this file at the tag v0.2.0 (image sha256:b95f77cd...).
# The engine-v0.1.0 recipe is this file at the tag v0.1.0 (image sha256:35409ff9...).
schema = 1
status = "released"

[model]
name       = "pn3"          # optional short alias; the repo id is the model's name
title      = "Qwen3.8-27B-PN3 (P100-native 3-bit, mix P0k+19)"
hf_repo    = "iamMrDuncan/Qwen3.8-27B-PN3-GGUF"
revision   = "c701b6690ec360b16d40f85df1cb76062e30cd38"
file       = "Qwen3.8-27B-PN3-P0k19.gguf"
sha256     = "15ce2d4469673f1f1753c55de3780cfe04311dd6f05cb41633d73df128e91476"
size_bytes = 12954114496
license    = "Apache-2.0 (from Qwen/Qwen3.8-27B)"

[card]
id                 = "p100"
title              = "NVIDIA Tesla P100 16 GB"
compute_capability = "6.0"
min_memory_mib     = 16000
min_driver         = "525.60.13"

[engine]
release = "engine-v0.4.1"
arch    = "sm60"
image   = "ghcr.io/iammrduncan/tensorless-engine@sha256:c89e60b34a0f6098db20f2f2b43c78a93bb70192833cf7656b4a84ae8974346a"   # 0.4.1-sm60 (measured as 0.4.1-rc1-sm60)

[run]
alias       = "iamMrDuncan/Qwen3.8-27B-PN3-GGUF"
context     = 65536
threads_max = 8
args = [
  "-np", "1",
  "-ngl", "99",
  "-ot", "token_embd.weight=CUDA0",
  "-ctk", "q4_0", "-ctv", "q4_0",
  "-sm", "none",
  "-lm", "none",
  "-fit", "off",
  "--threads-http", "4",
  "-b", "512", "-ub", "512",
  "-fa", "on",
  "--jinja",
]

[run.env]
GGML_CUDA_FATTN_SM60            = "1"
GGML_CUDA_MMV_SM60              = "1"
GGML_CUDA_FUSE_PRE_ADD          = "1"
GGML_CUDA_MMV_SM60_XXS_STOCK    = "1"
GGML_CUDA_SM86_IQ3_SMEM_GRID    = "1"
GGML_CUDA_MMV_SM60_IQ3S_STOCK   = "1"
GGML_CUDA_FATTN_SM60_CTAS       = "4"
GGML_CUDA_MMV_SM60_XXS_KB_WIDE  = "1"
GGML_CUDA_MMV_SM60_INPLACE_XXS  = "1"
GGML_CUDA_MMV_SM60_INPLACE_IQ3S = "1"
GGML_CUDA_MMV_SM60_Q4K_HEAD     = "1"
GGML_CUDA_MMV_SM60_Q3K          = "1"
GGML_CUDA_MMV_SM60_Q4K_DHEAD    = "1"
GGML_CUDA_MMV_SM60_Q6K          = "1"
GGML_CUDA_NORM_EMIT_Q8          = "1"
GGML_CUDA_PREFILL_DEQ_F4        = "1"
GGML_CUDA_PREFILL_REP_DIRECT    = "1"
GGML_CUDA_PREFILL_CHUNK_GEMM    = "1"
GGML_CUDA_PREFILL_CHUNK_STREAMS = "3"
GGML_CUDA_SM86_GDN_COLS         = "8"
GGML_CUDA_FATTN_TILE_OCC1       = "1"
GGML_CUDA_SYNC_SCHED            = "auto"   # engine-v0.3.0's host sync schedule; engine-v0.4.0 defaults to "blocking"

[receipt]
source  = "decode_tps.short and prefill: the prefill hill climb's judge, on a source build of engine-v0.2.0's research commit. engine-v0.4.1's published image, measured on a P100 with GGML_CUDA_SYNC_SCHED=auto: 30.30 tok/s median decode with tensorless bench, and 192.8 tok/s prefill on a cold 3,651-token prompt; engine-v0.4.0's image read 30.17 and 192.4 on the same card in the same hour (docs/receipts/engine-v0.4.1/Qwen3.8-27B-PN3-GGUF-p100.md)."
summary = "Prefill about 200 tok/s on a cold prompt of about 4,100 tokens, 1.65x engine-v0.1.0. Decode about 30 tok/s at short context, 1.14x the Q3 baseline model on the same card. Not yet measured at 32K or 65K."
decode_tps  = { short = 30.43 }
prefill_tps = { ctx_4k = 200.1 }
notes = [
  "short: 256 greedy tokens after a cold prompt of about 600 tokens (code prompt; prose read 30.31). engine-v0.1.0 read 29.95 in the same cells when the prefill climb began.",
  "ctx_4k: a cold prompt of about 4,100 tokens, code (prose read 198.9). engine-v0.1.0 read 121.4 (prose 119.6) in the same cells.",
  "From block 27 up, a prompt's batched products run on fp16 operands, held within the climb's numerics bars against engine-v0.1.0. Single-token decode keeps the PN GEMV kernels.",
  "GGML_CUDA_SYNC_SCHED=auto is how a CUDA synchronize waited in engine-v0.3.0 and before: the driver's default. engine-v0.4.0 makes it sleep (blocking) unless told otherwise; on the release gate's P100 that read 30.20 and 30.13 tok/s with tensorless bench, about 1% below auto, so this recipe keeps auto.",
  "--jinja is not part of the measured configuration; it only applies the chat template for /v1/chat/completions.",
]
