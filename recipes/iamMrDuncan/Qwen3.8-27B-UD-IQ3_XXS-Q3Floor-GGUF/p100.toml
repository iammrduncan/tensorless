# Qwen3.8-27B UD-IQ3_XXS Q3Floor on one Tesla P100 16 GB.
# Unsloth's Qwen3.8-27B-UD-IQ3_XXS.gguf (unsloth/Qwen3.8-27B-GGUF @ 4ca720788d1e01f1bff70c033e0d0028fd02e502) with a
# 3-bit floor: its 91 sub-3-bit tensors re-quantized to IQ3_XXS (stock llama-quantize, Unsloth's BF16 and imatrix)
# and token_embd taken from Unsloth's UD-IQ4_XS. Standard llama.cpp types; everything else, metadata included, is
# Unsloth's file byte for byte. Hosted whole, renamed only (same sha256 as the file that was measured; known in the
# research as "A1"). It was the model the P100 kernel campaigns were first tuned on, and the comparison model of
# every PN measurement.
# [run] is the configuration the decode hill climb's judge decoded it with, on this engine, in every block.
schema = 1
status = "draft"

[model]
name       = "q3floor"           # optional short alias; the repo id is the model's name
title      = "Qwen3.8-27B UD-IQ3_XXS Q3Floor (Unsloth's UD-IQ3_XXS with a 3-bit floor)"
hf_repo    = "iamMrDuncan/Qwen3.8-27B-UD-IQ3_XXS-Q3Floor-GGUF"
revision   = "0000000000000000000000000000000000000000"
file       = "Qwen3.8-27B-UD-IQ3_XXS-Q3Floor.gguf"
sha256     = "4b4d6a39dca07c915472b3fdf70267385f6e6f3f38befd5223c9a1ac272cecd0"
size_bytes = 11758422944
license    = "Apache-2.0 (from Qwen/Qwen3.8-27B and unsloth/Qwen3.8-27B-GGUF)"

[card]
id                 = "p100"
title              = "NVIDIA Tesla P100 16 GB"
compute_capability = "6.0"
min_memory_mib     = 16000
min_driver         = "525.60.13"

[engine]
release = "engine-v0.1.0"
arch    = "sm60"
image   = "ghcr.io/iammrduncan/tensorless-engine@sha256:35409ff97c2f518e468790c28bd19206ae777a945fcffe5775585e28fd9939a7"   # 0.1.0-rc1

[run]
alias       = "iamMrDuncan/Qwen3.8-27B-UD-IQ3_XXS-Q3Floor-GGUF"
context     = 65536
threads_max = 8
args = [
  "-np", "1",
  "-ngl", "99",
  "-ot", "token_embd.weight=CUDA0",
  "-ctk", "q4_0", "-ctv", "q4_0",
  "-sm", "none",
  "-lm", "none",
  "-fit", "off",
  "--threads-http", "4",
  "-b", "512", "-ub", "512",
  "-fa", "on",
  "--jinja",
]

[run.env]
GGML_CUDA_FATTN_SM60            = "1"
GGML_CUDA_MMV_SM60              = "1"
GGML_CUDA_FUSE_PRE_ADD          = "1"
GGML_CUDA_MMV_SM60_XXS_STOCK    = "1"
GGML_CUDA_SM86_IQ3_SMEM_GRID    = "1"
GGML_CUDA_MMV_SM60_IQ3S_STOCK   = "1"
GGML_CUDA_FATTN_SM60_CTAS       = "4"
GGML_CUDA_MMV_SM60_XXS_KB_WIDE  = "1"
GGML_CUDA_MMV_SM60_INPLACE_XXS  = "1"
GGML_CUDA_MMV_SM60_INPLACE_IQ3S = "1"
GGML_CUDA_MMV_SM60_Q4K_HEAD     = "1"
GGML_CUDA_MMV_SM60_Q3K          = "1"
GGML_CUDA_MMV_SM60_Q4K_DHEAD    = "1"
GGML_CUDA_MMV_SM60_Q6K          = "1"
GGML_CUDA_NORM_EMIT_Q8          = "1"
GGML_CUDA_PREFILL_DEQ_F4        = "1"
GGML_CUDA_PREFILL_REP_DIRECT    = "1"
GGML_CUDA_PREFILL_CHUNK_GEMM    = "1"
GGML_CUDA_PREFILL_CHUNK_STREAMS = "3"
GGML_CUDA_SM86_GDN_COLS         = "8"
GGML_CUDA_FATTN_TILE_OCC1       = "1"

[receipt]
source  = "Research measurements by the hill climb's judge on a source build of the same engine commit, one P100. The engine-v0.1.0 release gate re-measures the published image."
summary = "Decode about 26.3 tok/s at short context and 24.5 / 22.9 tok/s at 32K / 65K. No speculative decoding in this recipe."
decode_tps = { short = 26.26, ctx_32k = 24.52, ctx_65k = 22.92 }
notes = [
  "short: 256 greedy tokens after a cold prompt of about 600 tokens, code prompt (prose 26.27), on this engine commit.",
  "ctx_32k / ctx_65k: 1,024 greedy tokens after a 31.7K / 64.5K-token prompt, code (prose 24.54 / 22.97), measured on the hill climb's starting commit. A1's code path changed little after it: A1's text stayed bit-identical, and its speed was guarded within 3%.",
  "The earlier kernel campaign also ran A1 with MTP speculation (about 28 tok/s at 32K/65K on its own engine version). That mode is not in this recipe yet.",
  "--jinja is not part of the measured configuration; it only applies the chat template for /v1/chat/completions.",
]
