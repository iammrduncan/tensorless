name: engine-image

# Builds one engine image per architecture and publishes it to GHCR.
# A tag engine-vX.Y.Z publishes ghcr.io/<owner>/tensorless-engine:X.Y.Z-sm60.
# A manual run publishes the version you give it (use a -dev or -rc suffix for anything unreleased).
# The digest printed in the job summary is what recipes pin; publish a recipe only after the
# release gate has measured that exact digest.

on:
  push:
    tags: ["engine-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version label, e.g. 0.1.0-rc1"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: engine-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sm60:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#engine-v}"; else v="$INPUT_VERSION"; fi
          case "$v" in ''|*[!0-9A-Za-z.-]*) echo "bad version: '$v'"; exit 1;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tensorless-engine" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/engine.sm60.Containerfile
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}-sm60
          cache-from: type=gha,scope=engine-sm60
          cache-to: type=gha,mode=max,scope=engine-sm60

      - name: Summary
        run: |
          {
            echo "### tensorless-engine ${{ steps.v.outputs.version }} (sm60)"
            echo
            echo "Pin this in recipes after the release gate has measured it:"
            echo
            echo '```'
            echo "${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
